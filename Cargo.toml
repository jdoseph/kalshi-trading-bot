[package]
name = "kalshi-trading-bot"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kalshi trading bot — Kalshi-native automated execution engine."
repository = "https://github.com/HarrierOnChain/Kalshi"

[[bin]]
name = "kalshi-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# HTTP + JSON
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Kalshi RSA-PSS request signing
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# Timestamps
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }

# TUI
ratatui = "0.28"
crossterm = "0.28"

[dev-dependencies]
# For deterministic signature tests we verify with the public half of a key.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
